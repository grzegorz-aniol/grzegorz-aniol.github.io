<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oLLMpiada results</title>
<style>body { margin: 0; background: #fff; }</style>
<template id="ollmpiada-results-style"><style>
/* Styles for <ollmpiada-results>; loaded inside its shadow root. */
:host {
  --ink: #1d1d1f;
  --muted: #6b6b70;
  --line: #e2e2e6;
  --soft: #f5f5f7;
  --accent: #2f5fa7;
  --bg: #ffffff;
  display: block;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px 48px;
  color: var(--ink);
  background: var(--bg);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

h1 { font-size: 1.6rem; margin: 24px 0 4px; }
h2 { font-size: 1.15rem; margin: 32px 0 4px; }
p { margin: 4px 0; }
.muted, .n, .note { color: var(--muted); }
.n, .note { font-size: 0.85rem; }
.scope { font-weight: 500; }

/* control bar */
.controls {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.85rem;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.group > .lbl { color: var(--muted); margin-right: 2px; }
.fam {
  border: 0;
  background: none;
  font: inherit;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  padding: 2px 2px;
}
.chip {
  font: inherit;
  border: 1px solid var(--c);
  border-radius: 999px;
  padding: 1px 9px;
  background: var(--bg);
  color: var(--ink);
  cursor: pointer;
}
.chip::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  background: var(--c);
  vertical-align: 0;
}
.chip.off { opacity: 0.45; border-style: dashed; }
.chip.on { background: color-mix(in srgb, var(--c) 14%, white); }
label { cursor: pointer; white-space: nowrap; }
select { font: inherit; }

/* tables */
.tablewrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; white-space: nowrap; }
th { position: relative; font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
th.sorted { color: var(--ink); }
th.sorted::after { content: " ▾"; }
th.sorted.asc::after { content: " ▴"; }
td.num, th.num { text-align: right; }
tbody tr:hover { background: var(--soft); }
tr.clickable { cursor: pointer; }
tr.detail > td { background: var(--soft); padding: 6px 10px 10px; }
tr.detail table { font-size: 0.8rem; background: var(--bg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }
.star { color: var(--muted); }
.strip { vertical-align: middle; }
.banner {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 8px;
  margin-top: 4px;
}
.banner button { font: inherit; border: 0; background: none; color: var(--accent); cursor: pointer; }

/* charts */
.chart { width: 100%; min-height: 200px; }
.legend-text { font-size: 0.8rem; color: var(--muted); }
.warn { color: #9a4b00; }

ul.notes { padding-left: 18px; }
ul.notes li { margin: 3px 0; }

@media (max-width: 640px) {
  :host { font-size: 13px; }
  h1 { font-size: 1.3rem; }
}
</style></template>

<script>
/*
 * <ollmpiada-results>: interactive oLLMpiada results report.
 *
 * Data: the `src` attribute (URL of a results.json) or, without it, the inline
 * <script type="application/json" id="ollmpiada-data">. Styles: the inline
 * <template id="ollmpiada-results-style"> that report.py writes, else
 * ollmpiada-results.css next to this script. Charts use Apache ECharts 5 from
 * jsDelivr, loaded on demand; tables render without it.
 *
 * Every view is recomputed from runs and games whenever a control changes.
 */
(() => {
  const ECHARTS_URL = "https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js";
  const SCRIPT_SRC = document.currentScript ? document.currentScript.src : "";

  let echartsLoading = null;
  function loadECharts() {
    if (window.echarts) return Promise.resolve(window.echarts);
    echartsLoading ??= new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = ECHARTS_URL;
      s.onload = () => resolve(window.echarts);
      s.onerror = () => reject(new Error(`could not load ${ECHARTS_URL}`));
      document.head.appendChild(s);
    });
    return echartsLoading;
  }

  // ---- formatting -------------------------------------------------------------
  const esc = (s) =>
    String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const half = (x) => {
    const i = Math.floor(x);
    const h = x - i >= 0.5 ? "½" : "";
    return i === 0 && h ? h : `${i}${h}`;
  };
  const ratio = (a, b) => (b ? a / b : null);
  const per100 = (m) => ratio(100 * m.illegal, m.moves);
  const pctOf = (pts, n) => (n ? (100 * pts) / n : null);
  const fmtPct = (v) => (v == null ? "–" : `${Math.round(v)}%`);
  const fmtNum = (v, digits = 0) =>
    v == null ? "–" : v.toLocaleString("en-US", { maximumFractionDigits: digits, minimumFractionDigits: digits });
  const fmtTok = (v) => (v >= 10000 ? `${fmtNum(v / 1000)}k` : fmtNum(v));
  const stampLabel = (s) => `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)} ${s.slice(9, 11)}:${s.slice(11, 13)}`;
  // A pair's key and default order: the smaller id first (report.py breaks ties the same way).
  const pairKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
  const flipScore = (s) => {
    if (s.startsWith("#")) return "#" + (s[1] === "-" ? "+" : "-") + s.slice(2);
    const v = -parseInt(s, 10);
    return `${v > 0 ? "+" : ""}${v} cp`;
  };
  const wdl = (t) => `${t.w}-${t.d}-${t.l}`;

  const END_SERIES = [
    // [name, colour, count from the first player's pair view, category id]
    ["checkmate", "#2b5c8a", (v) => v.cat.checkmate.w + v.cat.checkmate.l, "checkmate"],
    ["resignation", "#6d9fcf", (v) => v.cat.resignation.w + v.cat.resignation.l, "resignation"],
    ["forfeit by A", "#b5562f", (v) => v.cat.forfeit.l, "forfeit"],
    ["forfeit by B", "#e8a985", (v) => v.cat.forfeit.w, "forfeit"],
    ["adjudication win A", "#3e7d3a", (v) => v.cat.adjudication.w, "adjudication"],
    ["adjudication win B", "#a5cc98", (v) => v.cat.adjudication.l, "adjudication"],
    ["adjudication draw", "#cbbf6a", (v) => v.cat.adjudication.d, "adjudication"],
    ["rule draw", "#bcbcbc", (v) => v.cat.rule_draw.d + v.cat.rule_draw.w + v.cat.rule_draw.l, "rule_draw"],
    ["agreed draw", "#d8c9a3", (v) => v.cat.agreed_draw.d + v.cat.agreed_draw.w + v.cat.agreed_draw.l, "agreed_draw"],
    ["error", "#6f6f6f", (v) => v.cat.error.w + v.cat.error.d + v.cat.error.l, "error"],
  ];

  // Cost per move for the "Who beats whom" x axis and the per-move table columns.
  const COST_METRICS = {
    spm: { label: "seconds per move", digits: 2, val: (m) => ratio(m.time, m.moves) },
    otpm: { label: "output tokens per move", digits: 1, val: (m) => ratio(m.outTok, m.moves) },
    itpm: { label: "input tokens per move", digits: 0, val: (m) => ratio(m.inTok, m.moves) },
  };

  /* Points no other point beats on both cost (lower x) and score (higher y), by cost. */
  function paretoFront(points) {
    const beats = (b, a) => b.x <= a.x && b.y >= a.y && (b.x < a.x || b.y > a.y);
    return points.filter((a) => !points.some((b) => beats(b, a))).sort((a, b) => a.x - b.x || a.y - b.y);
  }

  /* Sets labelPos (an ECharts label position) for each point (sx, sy: pixels from the plot's
     top left, node size 16): the first candidate whose label box (estimated from the text
     length at 11px) overlaps no node, no earlier label and stays inside the bounds; else
     the one with the fewest overlaps. Only labels move, so every node stays at its true
     score and cost. */
  function placeLabels(points, label, bounds) {
    const R = 9; // node radius plus a pixel
    const boxes = points.map((p) => ({ x0: p.sx - R, x1: p.sx + R, y0: p.sy - R, y1: p.sy + R }));
    const overlap = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;
    const outside = (b) => b.x0 < bounds.x0 || b.x1 > bounds.x1 || b.y0 < bounds.y0 || b.y1 > bounds.y1;
    points.forEach((p, i) => {
      const w = 6.5 * label(p).length + 8;
      // [position, box left, box top]; an array position is relative to the node's top left
      // corner and anchors the text's top left, which suits nodes at the left edge.
      const candidates = [
        ["bottom", -w / 2, 12],
        ["top", -w / 2, -26],
        ["right", 12, -7],
        [[4, 20], -4, 12],
        [[4, -18], -4, -26],
        ["left", -12 - w, -7],
      ].map(([pos, dx, dy]) => [pos, { x0: p.sx + dx, x1: p.sx + dx + w, y0: p.sy + dy, y1: p.sy + dy + 14 }]);
      const cost = (b) => boxes.filter((o, j) => j !== i && overlap(b, o)).length + (outside(b) ? 1 : 0);
      const [pos, box] = candidates.reduce((best, c) => (cost(c[1]) < cost(best[1]) ? c : best));
      p.labelPos = pos;
      boxes.push(box);
    });
  }

  class OllmpiadaResults extends HTMLElement {
    async connectedCallback() {
      if (this.shadowRoot) return;
      this.root = this.attachShadow({ mode: "open" });
      this.root.append(this.styleNode());
      try {
        this.data = await this.loadData();
      } catch (err) {
        this.root.append(Object.assign(document.createElement("p"), { textContent: `No results data: ${err.message}` }));
        return;
      }
      this.index();
      this.skeleton();
      this.update();
      loadECharts()
        .then((ec) => {
          this.ec = ec;
          this.charts = {};
          let width = 0;
          let timer = null;
          new ResizeObserver(([entry]) => {
            Object.values(this.charts).forEach((c) => c.resize());
            // Graph labels are placed in pixels, so a new width re-places them (debounced).
            if (entry.contentRect.width === width) return;
            width = entry.contentRect.width;
            clearTimeout(timer);
            timer = setTimeout(() => this.renderGraph(), 150);
          }).observe(this);
          this.renderCharts();
        })
        .catch((err) => {
          this.root.querySelectorAll(".chart").forEach((el) => {
            el.innerHTML = `<p class="warn">Chart unavailable: ${esc(err.message)}.</p>`;
          });
        });
    }

    styleNode() {
      const tpl = document.getElementById("ollmpiada-results-style");
      if (tpl) return tpl.content.cloneNode(true);
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = new URL("ollmpiada-results.css", SCRIPT_SRC || location.href).href;
      return link;
    }

    async loadData() {
      const src = this.getAttribute("src");
      if (src) {
        const res = await fetch(src);
        if (!res.ok) throw new Error(`${src}: HTTP ${res.status}`);
        return res.json();
      }
      const el = document.getElementById("ollmpiada-data");
      if (!el) throw new Error("no inline data script");
      return JSON.parse(el.textContent);
    }

    index() {
      const D = this.data;
      this.model = Object.fromEntries(D.models.map((m) => [m.id, m]));
      this.gamesByRun = new Map();
      for (const g of D.games) {
        if (!this.gamesByRun.has(g.run)) this.gamesByRun.set(g.run, []);
        this.gamesByRun.get(g.run).push(g);
      }
      this.catById = Object.fromEntries(D.meta.categories.map((c) => [c.id, c]));
      this.state = {
        models: new Set(D.models.map((m) => m.id)),
        cats: new Set(D.meta.categories.filter((c) => c.default).map((c) => c.id)),
        metric: "spm",
        pair: null,
        open: new Set(),
        sort: { leader: ["score", -1], draws: ["offers", -1], pairs: ["score", -1], cost: ["calls", -1] },
      };
    }

    // ---- static layout and controls ------------------------------------------
    skeleton() {
      const D = this.data;
      const families = Object.keys(D.meta.families).filter((f) => D.models.some((m) => m.family === f));
      const chips = families
        .map(
          (f) =>
            `<span class="group"><button class="fam" data-fam="${esc(f)}" title="Toggle the family">${esc(f)}</button>` +
            D.models
              .filter((m) => m.family === f)
              .map((m) => `<button class="chip on" data-model="${esc(m.id)}" style="--c:${m.colour}" title="${esc(m.id)}">${esc(m.label)}</button>`)
              .join("") +
            `</span>`,
        )
        .join("");
      const cats = D.meta.categories
        .map((c) => `<label title="${esc(c.reasons.join(", ") || "any other reason (HTTP errors, timeouts)")}"><input type="checkbox" data-cat="${c.id}" ${c.default ? "checked" : ""}> ${esc(c.label)}</label>`)
        .join("");
      const metrics = Object.entries(COST_METRICS)
        .map(([k, m]) => `<option value="${k}">${m.label}</option>`)
        .join("");
      const page = document.createElement("div");
      page.innerHTML = `<header>
          <h1>oLLMpiada — chess results</h1>
          <p class="muted" id="span"></p>
          <p class="scope">${esc(D.meta.scope)}</p>
          <p class="muted" id="counts"></p>
        </header>
        <div class="controls">
          <div class="row"><span class="group"><span class="lbl">Models</span></span>${chips}
            <span class="note">only games between selected models</span></div>
          <div class="row"><span class="group"><span class="lbl">Endings</span>${cats}</span></div>
        </div>
        <section><h2>Leaderboard</h2><p class="n" id="leaderN"></p><div class="tablewrap" id="leader"></div>
          <p class="note">Cost columns (illegal, time, tokens) cover the whole counted runs; they cannot be split by how games ended.</p></section>
        <section><h2>Head to head</h2><p class="n" id="matrixN"></p>
          <p class="legend-text">Cell: row model's points against the column model; colour = its score (red below 50%, green above, grey = not played). Click a cell to show that pair below.</p>
          <div class="chart" id="matrix"></div></section>
        <section><h2>Who beats whom</h2><p class="n" id="graphN"></p>
          <p class="legend-text">Top left is best: higher score at a lower cost per move. Arrow from the better to the worse model; width = margin (points minus half the games); faint = fewer than 5 decisive games; dashed, no arrow = exact tie. Blue step line and dark outline = Pareto frontier: no other model has both a higher score and a lower cost. basal is a decision model: it has no output tokens and its input carries the move list. haiku runs through an API, the others on the local GPU, so time is not hardware-neutral.</p>
          <p class="row"><label>Cost <select id="metric">${metrics}</select></label></p>
          <div class="chart" id="graph"></div></section>
        <section><h2>How games ended</h2><p class="n" id="endsN"></p>
          <p class="legend-text">A is the first-named model of each pair: the winner by points.</p>
          <div class="chart" id="ends"></div></section>
        <section><h2>Draw offers and resignations</h2><p class="n" id="drawsN"></p>
          <p class="legend-text">Offered: draws the model proposed with a move. Received: the opponent's offers it answered (an offer made with a game's last move gets no answer). Accepted: offers it accepted, so agreed draws. Resigned: games it resigned. Counted over the games the filters keep.</p>
          <div class="tablewrap" id="draws"></div></section>
        <section><h2>Pairs</h2><p class="n" id="pairsN"></p><div id="pairBanner"></div>
          <p class="legend-text">Category cells are wins of the first-named model – wins of the second (draws in the middle when there are any). Engine dots: adjudicated games, first-named model's view, clamped at ±2000 cp; a mate sits at the edge. Click a row for its games.</p>
          <div class="tablewrap" id="pairs"></div></section>
        <section><h2>Cost per model</h2><p class="n" id="costN"></p><div class="tablewrap" id="cost"></div></section>
        <section><h2>Local inference</h2><ul class="notes">${D.meta.local_inference.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></section>
        <section><h2>Notes</h2><ul class="notes" id="notes"></ul></section>`;
      this.root.append(page);
      this.bindControls();
    }

    bindControls() {
      const $ = (id) => this.root.getElementById(id);
      const s = this.state;
      this.root.querySelector(".controls").addEventListener("click", (e) => {
        const chip = e.target.closest("[data-model]");
        const fam = e.target.closest("[data-fam]");
        if (chip) {
          const id = chip.dataset.model;
          s.models.has(id) ? s.models.delete(id) : s.models.add(id);
        } else if (fam) {
          const ids = this.data.models.filter((m) => m.family === fam.dataset.fam).map((m) => m.id);
          const allOn = ids.every((id) => s.models.has(id));
          ids.forEach((id) => (allOn ? s.models.delete(id) : s.models.add(id)));
        } else return;
        this.root.querySelectorAll("[data-model]").forEach((c) => {
          c.classList.toggle("on", s.models.has(c.dataset.model));
          c.classList.toggle("off", !s.models.has(c.dataset.model));
        });
        this.update();
      });
      this.root.querySelectorAll("[data-cat]").forEach((cb) =>
        cb.addEventListener("change", () => {
          cb.checked ? s.cats.add(cb.dataset.cat) : s.cats.delete(cb.dataset.cat);
          this.update();
        }),
      );
      $("metric").addEventListener("change", (e) => {
        s.metric = e.target.value;
        if (this.ec) this.renderGraph();
      });
      for (const name of ["leader", "draws", "pairs", "cost"]) {
        $(name).addEventListener("click", (e) => {
          const th = e.target.closest("th[data-col]");
          const tr = e.target.closest("tr[data-key]");
          if (th) {
            const [col, dir] = s.sort[name];
            // A new column sorts text A→Z and numbers high→low first.
            const first = th.dataset.text ? 1 : -1;
            s.sort[name] = [th.dataset.col, col === th.dataset.col ? -dir : first];
          } else if (tr && name === "pairs") {
            const k = tr.dataset.key;
            s.open.has(k) ? s.open.delete(k) : s.open.add(k);
          } else return;
          this.renderTables();
        });
      }
      $("pairBanner").addEventListener("click", (e) => {
        if (e.target.closest("button")) {
          s.pair = null;
          this.update();
        }
      });
    }

    // ---- computation -----------------------------------------------------------
    compute() {
      const s = this.state;
      const runs = this.data.runs.filter((r) => r.players.every((p) => s.models.has(p)));
      const games = runs.flatMap((r) => (this.gamesByRun.get(r.stamp) || []).filter((g) => s.cats.has(g.category)));
      const pairs = this.aggregatePairs(runs, games);
      const models = this.aggregateModels(runs, games);
      return { runs, games, pairs, models };
    }

    aggregateModels(runs, games) {
      const M = new Map();
      const get = (id) => {
        if (!M.has(id))
          M.set(id, { id, runs: 0, n: 0, w: 0, d: 0, l: 0, pts: 0, wN: 0, wPts: 0, bN: 0, bPts: 0, opp: new Set(), forfeits: 0, offers: 0, answered: 0, accepted: 0, resigned: 0, moves: 0, calls: 0, time: 0, inTok: 0, outTok: 0, illegal: 0 });
        return M.get(id);
      };
      for (const r of runs) {
        r.players.forEach((p, i) => {
          const m = get(p);
          const st = r.stats[i];
          m.runs += 1;
          m.opp.add(r.players[1 - i]);
          m.moves += st.moves || 0;
          m.calls += st.calls || 0;
          m.time += st.thinking_s || 0;
          m.inTok += st.input_tokens || 0;
          m.outTok += st.output_tokens || 0;
          m.illegal += st.illegal_attempts || 0;
        });
      }
      for (const g of games) {
        for (const [p, white] of [[g.white, true], [g.black, false]]) {
          const m = get(p);
          const pts = g.winner == null ? 0.5 : g.winner === p ? 1 : 0;
          m.n += 1;
          m.pts += pts;
          m[pts === 1 ? "w" : pts === 0 ? "l" : "d"] += 1;
          if (white) (m.wN += 1), (m.wPts += pts);
          else (m.bN += 1), (m.bPts += pts);
        }
        if (g.forfeited_by) get(g.forfeited_by).forfeits += 1;
        if (g.resigned_by) get(g.resigned_by).resigned += 1;
        if (g.draw_accepted_by) get(g.draw_accepted_by).accepted += 1;
        for (const [p, k] of Object.entries(g.draw_offers || {})) get(p).offers += k;
        for (const [p, k] of Object.entries(g.draw_offers_answered || {})) get(p).answered += k;
      }
      for (const m of M.values()) m.score = pctOf(m.pts, m.n);
      return [...M.values()].sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
    }

    /* One pair per run. */
    aggregatePairs(runs, games) {
      const P = new Map(
        runs.map((run) => {
          const key = pairKey(...run.players);
          const [a, b] = key.split("|");
          return [key, { key, a, b, run, games: [] }];
        }),
      );
      games.forEach((g) => P.get(pairKey(g.white, g.black)).games.push(g));
      return [...P.values()];
    }

    /* The pair seen from player x: totals, per-category W-D-L, engine scores. */
    view(p, x) {
      const y = x === p.a ? p.b : p.a;
      const cat = Object.fromEntries(this.data.meta.categories.map((c) => [c.id, { w: 0, d: 0, l: 0 }]));
      const v = { p, key: p.key, x, y, n: 0, w: 0, d: 0, l: 0, pts: 0, decisive: 0, moves: 0, adj: [], cat };
      for (const g of p.games) {
        const res = g.winner == null ? "d" : g.winner === x ? "w" : "l";
        v[res] += 1;
        cat[g.category][res] += 1;
        v.n += 1;
        v.moves += g.moves;
        if (res !== "d" && this.catById[g.category].decisive) v.decisive += 1;
        if (g.category === "adjudication" && g.score) {
          const mine = g.white === x;
          v.adj.push({ cp: mine ? g.score_cp : -g.score_cp, label: mine ? g.score : flipScore(g.score), number: g.number });
        }
      }
      v.pts = v.w + v.d / 2;
      v.score = pctOf(v.pts, v.n);
      return v;
    }

    /* The pair from the winner's side (by points); an exact tie keeps the pair order. */
    winnerView(p) {
      const v = this.view(p, p.a);
      return v.pts < v.n / 2 ? this.view(p, p.b) : v;
    }

    /* Pairs as listed, winner first; only the clicked pair when one is picked. */
    pairViews(onlyPicked = false) {
      const s = this.state;
      return this.v.pairs.filter((p) => !onlyPicked || !s.pair || p.key === s.pair).map((p) => this.winnerView(p));
    }

    // ---- rendering ------------------------------------------------------------
    update() {
      this.v = this.compute();
      const { runs, games, models, pairs } = this.v;
      if (this.state.pair && !pairs.some((p) => p.key === this.state.pair)) this.state.pair = null;
      const $ = (id) => this.root.getElementById(id);
      const stamps = runs.map((r) => r.stamp).sort();
      $("span").textContent = stamps.length ? `${stampLabel(stamps[0])} – ${stampLabel(stamps[stamps.length - 1])}` : "no runs selected";
      $("counts").textContent = `${pairs.length} pairs · ${models.length} models · ${games.length} games counted`;
      const n = `${games.length} games counted from ${runs.length} runs.`;
      for (const id of ["leaderN", "matrixN", "graphN", "endsN", "drawsN", "pairsN", "costN"]) $(id).textContent = n;
      $("pairBanner").innerHTML = this.state.pair
        ? `<span class="banner">Only ${this.state.pair.split("|").map((m) => esc(this.model[m].label)).join(" vs ")} <button>show all pairs</button></span>`
        : "";
      this.renderTables();
      this.renderNotes();
      this.renderCharts();
    }

    renderTables() {
      this.renderLeader();
      this.renderDraws();
      this.renderPairs();
      this.renderCost();
    }

    /* True when a run used another name for the model (context variant or alias). */
    isRenamed(id, asRun) {
      return Boolean(asRun) && asRun !== id;
    }

    name(id, asRun) {
      const m = this.model[id];
      const star = this.isRenamed(id, asRun);
      const title = star ? `${id} (run as ${asRun})` : id;
      return `<span title="${esc(title)}"><span class="dot" style="--c:${m.colour}"></span>${esc(m.label)}${star ? '<span class="star">*</span>' : ""}</span>`;
    }

    /* Sortable table: cols = [{key, label, val(row), html(row)?, num?, text?, title?}]. */
    table(name, cols, rows, opts = {}) {
      const [key, dir] = this.state.sort[name];
      const col = cols.find((c) => c.key === key) || cols[0];
      const sorted = [...rows].sort((a, b) => {
        const x = col.val(a);
        const y = col.val(b);
        if (x == null || y == null) return (x == null) - (y == null);
        return (x < y ? -1 : x > y ? 1 : 0) * dir;
      });
      const head = cols
        .map((c) => `<th data-col="${c.key}"${c.text ? ' data-text="1"' : ""} class="${c.num ? "num" : ""} ${c === col ? `sorted ${dir > 0 ? "asc" : ""}` : ""}" title="${esc(c.title || "")}">${c.label}</th>`)
        .join("");
      const body = sorted
        .map((r) => {
          const k = opts.key ? opts.key(r) : null;
          const cells = cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.html ? c.html(r) : esc(c.val(r) ?? "–")}</td>`).join("");
          const row = `<tr${k ? ` data-key="${esc(k)}" class="clickable"` : ""}>${cells}</tr>`;
          const extra = opts.detail ? opts.detail(r) : "";
          return row + (extra ? `<tr class="detail"><td colspan="${cols.length}">${extra}</td></tr>` : "");
        })
        .join("");
      this.root.getElementById(name).innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    /* A per-move cost column from COST_METRICS. */
    costCol(key, label) {
      const { val, digits } = COST_METRICS[key];
      return { key, label, num: true, val, html: (m) => fmtNum(val(m), digits) };
    }

    renderLeader() {
      this.table("leader", [
        { key: "model", label: "Model", text: true, val: (m) => this.model[m.id].label, html: (m) => this.name(m.id) },
        { key: "runs", label: "Runs", num: true, val: (m) => m.runs },
        { key: "n", label: "Games", num: true, val: (m) => m.n, title: "games counted" },
        { key: "wdl", label: "W-D-L", val: (m) => m.w - m.l, html: wdl },
        { key: "score", label: "Score", num: true, val: (m) => m.score, html: (m) => fmtPct(m.score), title: "(wins + draws/2) / games" },
        { key: "white", label: "as White", num: true, val: (m) => pctOf(m.wPts, m.wN), html: (m) => fmtPct(pctOf(m.wPts, m.wN)) },
        { key: "black", label: "as Black", num: true, val: (m) => pctOf(m.bPts, m.bN), html: (m) => fmtPct(pctOf(m.bPts, m.bN)) },
        { key: "opp", label: "Opp.", num: true, val: (m) => m.opp.size, title: "opponents" },
        { key: "forfeits", label: "Forfeits", num: true, val: (m) => m.forfeits, title: "games lost by illegal answers" },
        { key: "illegal", label: "Illegal / 100 mv", num: true, val: per100, html: (m) => fmtNum(per100(m), 1), title: "rejected answers per 100 legal moves" },
        this.costCol("spm", "s / move"),
        this.costCol("otpm", "Out tok / move"),
      ], this.v.models);
    }

    renderDraws() {
      this.table("draws", [
        { key: "model", label: "Model", text: true, val: (m) => this.model[m.id].label, html: (m) => this.name(m.id) },
        { key: "n", label: "Games", num: true, val: (m) => m.n, title: "games counted" },
        { key: "offers", label: "Draws offered", num: true, val: (m) => m.offers },
        { key: "answered", label: "Offers received", num: true, val: (m) => m.answered, title: "the opponent's draw offers this model answered" },
        { key: "accepted", label: "Draws accepted", num: true, val: (m) => m.accepted },
        { key: "acceptRate", label: "Accepted %", num: true, val: (m) => pctOf(m.accepted, m.answered), html: (m) => fmtPct(pctOf(m.accepted, m.answered)), title: "accepted / received" },
        { key: "resigned", label: "Resigned", num: true, val: (m) => m.resigned, title: "games this model resigned" },
      ], this.v.models);
    }

    renderCost() {
      this.table("cost", [
        { key: "model", label: "Model", text: true, val: (m) => this.model[m.id].label, html: (m) => this.name(m.id) },
        { key: "calls", label: "Calls", num: true, val: (m) => m.calls, html: (m) => fmtNum(m.calls) },
        { key: "time", label: "Time (min)", num: true, val: (m) => m.time / 60, html: (m) => fmtNum(m.time / 60, 1) },
        this.costCol("spm", "s / move"),
        { key: "in", label: "Input tok", num: true, val: (m) => m.inTok, html: (m) => fmtTok(m.inTok) },
        { key: "out", label: "Output tok", num: true, val: (m) => m.outTok, html: (m) => fmtTok(m.outTok) },
        this.costCol("itpm", "In tok / move"),
        this.costCol("otpm", "Out tok / move"),
        { key: "illegal", label: "Illegal / 100 mv", num: true, val: per100, html: (m) => fmtNum(per100(m), 1) },
      ], this.v.models);
    }

    renderPairs() {
      const s = this.state;
      const cell = (t) => (t.d ? `${t.w}-${t.d}-${t.l}` : `${t.w}–${t.l}`);
      const catCol = (id, label) => ({
        key: id,
        label,
        num: true,
        val: (v) => v.cat[id].w + v.cat[id].d + v.cat[id].l,
        html: (v) => (v.cat[id].w + v.cat[id].d + v.cat[id].l ? (id === "rule_draw" || id === "agreed_draw" ? String(v.cat[id].d) : cell(v.cat[id])) : "·"),
      });
      // The name the model ran under in the pair's run.
      const asRun = (v, id) => v.p.run.players_as_run[v.p.run.players.indexOf(id)];
      const cols = [
        { key: "pair", label: "Pair", text: true, val: (v) => `${this.model[v.x].label} ${this.model[v.y].label}`, html: (v) => `${this.name(v.x, asRun(v, v.x))}<br>vs ${this.name(v.y, asRun(v, v.y))}` },
        { key: "wdl", label: "W-D-L", val: (v) => v.w - v.l, html: wdl },
        { key: "score", label: "Score", num: true, val: (v) => v.score, html: (v) => `${half(v.pts)}–${half(v.n - v.pts)}` },
        { key: "decisive", label: "Decisive", num: true, val: (v) => v.decisive, title: "wins by checkmate, resignation, forfeit or adjudication" },
        ...this.data.meta.categories.filter((c) => s.cats.has(c.id)).map((c) => catCol(c.id, c.label)),
        { key: "engine", label: "Engine at limit", val: (v) => v.adj.length, html: (v) => this.strip(v.adj) },
        { key: "len", label: "Avg moves", num: true, val: (v) => ratio(v.moves, v.n), html: (v) => fmtNum(ratio(v.moves, v.n)) },
        { key: "stamp", label: "Run", text: true, val: (v) => v.p.run.stamp },
      ];
      this.table("pairs", cols, this.pairViews(true), {
        key: (v) => v.key,
        detail: (v) => (s.open.has(v.key) ? this.gameList(v) : ""),
      });
    }

    strip(adj) {
      if (!adj.length) return "·";
      const w = 120;
      const h = 16;
      const x = (cp) => w / 2 + (Math.max(-2000, Math.min(2000, cp)) / 2000) * (w / 2 - 4);
      const dots = adj
        .map((a) => {
          const fill = a.cp > 0 ? "#3e7d3a" : a.cp < 0 ? "#b5562f" : "#888";
          const title = `<title>game ${esc(a.number)}: ${esc(a.label)}</title>`;
          return Math.abs(a.cp) >= this.data.meta.mate_cp
            ? `<rect x="${x(a.cp) - 3}" y="${h / 2 - 3}" width="6" height="6" fill="${fill}" fill-opacity="0.75">${title}</rect>`
            : `<circle cx="${x(a.cp).toFixed(1)}" cy="${h / 2}" r="3" fill="${fill}" fill-opacity="0.6">${title}</circle>`;
        })
        .join("");
      return `<svg class="strip" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="${w / 2}" x2="${w / 2}" y1="1" y2="${h - 1}" stroke="#bbb"/><line x1="4" x2="${w - 4}" y1="${h / 2}" y2="${h / 2}" stroke="#e2e2e6"/>${dots}</svg>`;
    }

    gameList(v) {
      const label = (id) => esc(this.model[id].label);
      const rows = [...v.p.games]
        .sort((a, b) => a.number - b.number)
        .map((g) => {
          const result = g.winner == null ? "draw" : `${label(g.winner)} wins`;
          return `<tr><td>${esc(g.number)}</td><td>${label(g.white)}</td><td>${label(g.black)}</td><td>${result} (${esc(g.result)})</td><td>${esc(g.reason)}</td><td class="num">${esc(g.moves)}</td><td>${esc(g.score || "")}</td></tr>`;
        })
        .join("");
      return `<table><thead><tr><th>Game</th><th>White</th><th>Black</th><th>Result</th><th>Reason</th><th class="num">Moves</th><th>Engine (White)</th></tr></thead><tbody>${rows || '<tr><td colspan="7">no counted games</td></tr>'}</tbody></table>`;
    }

    renderNotes() {
      const { meta } = this.data;
      const items = [...meta.notes];
      const renamed = new Set();
      for (const r of this.v.runs)
        r.players.forEach((id, i) => {
          if (this.isRenamed(id, r.players_as_run[i])) renamed.add(`${this.model[id].label} as ${r.players_as_run[i]}`);
        });
      if (renamed.size) items.push(`* Run under another name: ${[...renamed].join("; ")}.`);
      items.push(`Generated ${meta.generated}.`);
      this.root.getElementById("notes").innerHTML = items.map((t) => `<li>${esc(t)}</li>`).join("");
    }

    // ---- charts ---------------------------------------------------------------
    chart(id, height, option) {
      const el = this.root.getElementById(id);
      el.style.height = `${height}px`;
      if (!this.charts[id]) this.charts[id] = this.ec.init(el, null, { renderer: "canvas" });
      else {
        // A tooltip still up re-shows itself on a timer after setOption, into the element
        // that the replacing setOption removed, and ECharts throws; hide it first.
        this.charts[id].dispatchAction({ type: "hideTip" });
        this.charts[id].resize();
      }
      this.charts[id].setOption(option, true);
      return this.charts[id];
    }

    renderCharts() {
      if (!this.ec) return;
      this.renderMatrix();
      this.renderGraph();
      this.renderEnds();
    }

    catLines(v) {
      return this.data.meta.categories
        .filter((c) => this.state.cats.has(c.id))
        .map((c) => `${esc(c.label)}: ${wdl(v.cat[c.id])}`)
        .join("<br>");
    }

    renderMatrix() {
      const models = this.v.models.filter((m) => m.n);
      const labels = models.map((m) => this.model[m.id].label);
      const byKey = new Map(this.v.pairs.map((p) => [p.key, p]));
      const data = [];
      models.forEach((rm, yi) => {
        models.forEach((cm, xi) => {
          const p = rm.id !== cm.id && byKey.get(pairKey(rm.id, cm.id));
          if (!p || !p.games.length) return;
          const v = this.view(p, rm.id);
          data.push({ value: [xi, yi, v.score], label: half(v.pts), v });
        });
        data.push({ value: [models.length, yi, rm.score], label: `${half(rm.pts)}/${rm.n}`, total: rm });
      });
      const chart = this.chart("matrix", 90 + 34 * models.length, {
        grid: { left: 130, right: 10, top: 10, bottom: 80, show: true, backgroundColor: "#ececee", borderWidth: 0 },
        xAxis: { type: "category", data: [...labels, "Total"], axisLabel: { rotate: 35, interval: 0, fontSize: 11 }, splitArea: { show: false } },
        yAxis: { type: "category", data: labels, inverse: true, axisLabel: { fontSize: 11 } },
        visualMap: { show: false, min: 0, max: 100, dimension: 2, inRange: { color: ["#c2412d", "#f7f7f7", "#2f8f4a"] } },
        tooltip: {
          confine: true,
          formatter: (prm) => {
            const d = prm.data;
            if (d.total) {
              const m = d.total;
              return `<b>${esc(this.model[m.id].label)}</b> total<br>${half(m.pts)} / ${m.n} (${fmtPct(m.score)})<br>W-D-L ${wdl(m)}`;
            }
            const v = d.v;
            return `<b>${esc(this.model[v.x].label)}</b> vs ${esc(this.model[v.y].label)}<br>${half(v.pts)}–${half(v.n - v.pts)} (${fmtPct(v.score)}), n = ${v.n}<br>W-D-L ${wdl(v)}<br>${this.catLines(v)}`;
          },
        },
        series: [{
          type: "heatmap",
          data,
          label: { show: true, formatter: (prm) => prm.data.label, fontSize: 11, color: "#1d1d1f" },
          itemStyle: { borderColor: "#fff", borderWidth: 2 },
          emphasis: { itemStyle: { borderColor: "#333", borderWidth: 1 } },
        }],
      });
      chart.off("click");
      chart.on("click", (prm) => {
        if (!prm.data || !prm.data.v) return;
        this.state.pair = prm.data.v.key;
        this.update();
        this.root.getElementById("pairs").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    renderGraph() {
      const metric = COST_METRICS[this.state.metric];
      const points = this.v.models
        .filter((m) => m.n && metric.val(m) != null)
        .map((m) => ({ m, x: metric.val(m), y: m.score }));
      if (!points.length) {
        this.chart("graph", 420, { title: { text: "No models selected", left: "center", top: "middle", textStyle: { color: "#6b6b70", fontSize: 13, fontWeight: "normal" } } });
        return;
      }
      const xs = points.map((p) => p.x);
      const ys = points.map((p) => p.y);
      // Cost starts at 0 when a model costs nothing (basal's output tokens), else it hugs the data.
      const xPad = (Math.max(...xs) - Math.min(...xs)) * 0.08 || Math.max(...xs) * 0.1 || 1;
      const xMin = Math.max(0, Math.min(...xs) - xPad);
      const xMax = Math.max(...xs) + xPad;
      // Score bounds on the 10% grid, at least 5 points past the data.
      const yMin = Math.max(0, Math.floor((Math.min(...ys) - 5) / 10) * 10);
      const yMax = Math.min(100, Math.ceil((Math.max(...ys) + 5) / 10) * 10);
      const height = 460;
      const grid = { left: 60, right: 60, top: 50, bottom: 50 };
      const plotW = this.root.getElementById("graph").clientWidth - grid.left - grid.right;
      const plotH = height - grid.top - grid.bottom;
      for (const p of points) {
        p.sx = ((p.x - xMin) / (xMax - xMin)) * plotW;
        p.sy = ((yMax - p.y) / (yMax - yMin)) * plotH;
      }
      const label = (p) => this.model[p.m.id].label;
      // Labels may spill into the right margin and up to the legend, not over the axis labels.
      placeLabels(points, label, { x0: -6, x1: plotW + grid.right - 4, y0: 24 - grid.top, y1: plotH });
      const front = paretoFront(points);
      const families = [...new Set(points.map((p) => this.model[p.m.id].family))];
      const famColour = this.data.meta.families;
      const nodes = points.map(({ m, x, y, labelPos }) => {
        const meta = this.model[m.id];
        const best = front.some((f) => f.m === m);
        return {
          id: m.id,
          name: meta.label,
          value: [x, y],
          symbolSize: 16,
          label: { position: labelPos },
          category: families.indexOf(meta.family),
          itemStyle: { color: meta.colour, borderColor: best ? "#1d1d1f" : "#fff", borderWidth: best ? 2.5 : 1 },
          tooltip: {
            formatter: `<b>${esc(m.id)}</b><br>${fmtPct(m.score)} · ${half(m.pts)} / ${m.n}<br>${fmtNum(x, metric.digits)} ${metric.label}${best ? "<br>on the Pareto frontier" : ""}`,
          },
        };
      });
      const ids = new Set(points.map((p) => p.m.id));
      const views = this.v.pairs.filter((p) => p.games.length && ids.has(p.a) && ids.has(p.b)).map((p) => this.winnerView(p));
      const maxMargin = Math.max(1, ...views.map((v) => v.pts - v.n / 2));
      const links = views.map((v) => {
        const margin = v.pts - v.n / 2;
        const tie = margin === 0;
        const weak = v.decisive < 5;
        return {
          // Nodes have ids, so links refer to them by id.
          source: v.x,
          target: v.y,
          symbol: tie ? ["none", "none"] : ["none", "arrow"],
          symbolSize: 9,
          lineStyle: { width: 1 + (6 * margin) / maxMargin, opacity: weak ? 0.2 : 0.75, type: tie ? "dashed" : "solid", color: "#555", curveness: 0.12 },
          label: { show: !weak, formatter: `${half(v.pts)}–${half(v.n - v.pts)}`, fontSize: 10, color: "#444" },
          tooltip: {
            formatter: `<b>${esc(this.model[v.x].label)}</b> vs ${esc(this.model[v.y].label)}<br>${half(v.pts)}–${half(v.n - v.pts)}, n = ${v.n}, decisive ${v.decisive}<br>${this.catLines(v)}`,
          },
        };
      });
      // The frontier as a staircase along the top-left boundary: a model's score holds until
      // the next frontier model's cost (right), then rises to that model's score (up).
      const steps = front.flatMap((p, i) => (i + 1 < front.length ? [[p.x, p.y], [front[i + 1].x, p.y]] : [[p.x, p.y]]));
      const FRONT = "Pareto frontier";
      this.chart("graph", height, {
        tooltip: { confine: true },
        legend: { data: [...families, FRONT], top: 0 },
        // A cartesian grid keeps node symbols round at any chart width.
        grid,
        xAxis: {
          type: "value",
          name: `${metric.label}  (← cheaper)`,
          nameLocation: "middle",
          nameGap: 26,
          min: xMin,
          max: xMax,
          // Padded bounds are odd numbers; only a cost axis starting at 0 labels its minimum.
          axisLabel: { showMinLabel: xMin === 0, showMaxLabel: false, formatter: (val) => fmtNum(val, metric.digits) },
          splitLine: { lineStyle: { color: "#f0f0f0" } },
        },
        yAxis: {
          type: "value",
          name: "score %  (better ↑)",
          nameLocation: "middle",
          nameGap: 36,
          min: yMin,
          max: yMax,
          interval: 10,
          splitLine: { lineStyle: { color: "#f0f0f0" } },
        },
        series: [
          {
            type: "line",
            name: FRONT,
            data: steps,
            symbol: "none",
            silent: true,
            z: 1,
            itemStyle: { color: "#2f5fa7" },
            lineStyle: { color: "#2f5fa7", width: 2, opacity: 0.35 },
          },
          {
            type: "graph",
            coordinateSystem: "cartesian2d",
            categories: families.map((f) => ({ name: f, itemStyle: { color: famColour[f] } })),
            data: nodes,
            links,
            label: { show: true, position: "bottom", fontSize: 11, color: "#1d1d1f" },
            edgeLabel: { show: true },
            emphasis: { focus: "adjacency" },
          },
        ],
      });
    }

    renderEnds() {
      const views = this.pairViews().sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
      const label = (v) => `${this.model[v.x].label} vs ${this.model[v.y].label}`;
      const series = END_SERIES.filter((sr) => this.state.cats.has(sr[3])).map(([name, colour, count]) => ({
        name,
        type: "bar",
        stack: "games",
        barWidth: 14,
        itemStyle: { color: colour, borderColor: "#fff", borderWidth: 1 },
        data: views.map(count),
      }));
      this.chart("ends", 90 + 26 * views.length, {
        grid: { left: 10, right: 10, top: 50, bottom: 20, containLabel: true },
        legend: { top: 0, itemWidth: 12, itemHeight: 10, textStyle: { fontSize: 11 } },
        tooltip: { trigger: "axis", axisPointer: { type: "shadow" }, confine: true },
        xAxis: { type: "value", splitLine: { lineStyle: { color: "#eee" } } },
        yAxis: { type: "category", data: views.map(label), inverse: true, axisLabel: { fontSize: 11 } },
        series,
      });
    }
  }

  if (!customElements.get("ollmpiada-results")) customElements.define("ollmpiada-results", OllmpiadaResults);
})();
</script>
</body>
</html>
